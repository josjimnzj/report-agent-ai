# Blueprint de Render (plan gratuito): un solo servicio con front + API + agente. Valores sync:false se capturan en el panel.
services:
  - type: web
    name: ad-data-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL            # Neon: postgresql://…?sslmode=require
        sync: false
      - key: Telemetry__ConnectionString   # opcional: Postgres aparte para telemetría
        sync: false
      - key: Auth__ApiKey            # clave que exige /api (X-Api-Key)
        generateValue: true
      - key: VITE_DATA_API_KEY       # la misma clave, compilada en el front
        sync: false
      - key: Cors__AllowedOrigins    # solo hace falta si otra app llama a la API desde el navegador
        value: "*"
      - key: SqlMcp__Host
        sync: false
      - key: SqlMcp__Database
        sync: false
      - key: SqlMcp__User
        sync: false
      - key: SqlMcp__Password
        sync: false
      - key: SqlMcp__Encrypt
        value: "false"
      - key: SqlMcp__TrustCert
        value: "true"
